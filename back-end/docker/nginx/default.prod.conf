server {
    listen 80;
    server_name pixicrm.barmagiat.com barmagiat.com;
    root /var/www/html/public;

    # ACME challenge location - this must be accessible via HTTP
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/;
        try_files $uri =404;
        # Allow HTTP access for ACME challenge
        # Don't redirect to HTTPS for this location
    }

    # Redirect all other requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Change this to standard HTTPS port 443
    listen 443 ssl http2;
    server_name pixicrm.barmagiat.com;
    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/pixicrm.barmagiat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixicrm.barmagiat.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Your application proxy
    location / {
        # Update port to match the new HTTPS port
        proxy_pass http://app_php:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ~ \.php$ {
        fastcgi_pass app_php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location ~ /\.ht {
        deny all;
    }
}
