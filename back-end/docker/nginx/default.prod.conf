# HTTP server - ACME + redirect
server {
    listen 80;
    server_name pixicrm.barmagiat.com;

    root /var/www/html/public;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/;
        try_files $uri =404;
    }

    location /health {
        return 200 "healthy\n";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name pixicrm.barmagiat.com;

    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/pixicrm.barmagiat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixicrm.barmagiat.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/;
        try_files $uri =404;
    }

    location /health {
        return 200 "healthy\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app_php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location ~ /\. {
        deny all;
    }
}
