# HTTP (port 80) — only used for Let's Encrypt + redirect
server {
    listen 80;
    server_name pixicrm.barmagiat.com;

    # Serve ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS (8443)
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# HTTPS (port 8443)
server {
    listen 8443 ssl http2;
    server_name pixicrm.barmagiat.com;

    root /var/www/html/public;
    index index.php index.html;

    # SSL certificates (generated by certbot)
    ssl_certificate /etc/letsencrypt/live/pixicrm.barmagiat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixicrm.barmagiat.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Health check
    location /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Main app
    location / {
        try_files $uri $uri/ @php;
    }

    # PHP via proxy (fpm)
    location @php {
        proxy_pass http://app_php:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location ~ \.php$ {
        fastcgi_pass app_php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    # Protect sensitive files
    location ~ /\. {
        deny all;
    }
    location ~* \.(env|log|ini)$ {
        deny all;
    }
}
