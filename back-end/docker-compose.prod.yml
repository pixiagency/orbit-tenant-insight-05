services:
  nginx:
    depends_on:
      app_php:
        condition: service_started
        required: true
    ports:
      # Ensure both HTTP and HTTPS ports are exposed
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./letsencrypt/www:/var/www/certbot:ro
      # Mount your application files for serving static content if needed
      - ./public:/var/www/html/public:ro

  certbot:
    image: certbot/certbot:latest
    container_name: crm-certbot
    depends_on:
      - nginx
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./letsencrypt/www:/var/www/certbot

volumes:
  letsencrypt:
