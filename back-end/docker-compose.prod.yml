services:
  app_php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: crm-app
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./logs:/var/www/html/storage/logs
    networks:
      - laravel
    depends_on:
      - mysql
    restart: unless-stopped

  nginx:
    image: nginx:stable
    container_name: crm-nginx
    ports:
      - "80:80"      # required for Let's Encrypt HTTP-01 challenge
      - "8443:8443"  # custom HTTPS port
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./logs:/var/www/html/storage/logs
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - ./letsencrypt:/etc/letsencrypt            # SSL cert storage
      - ./letsencrypt/www:/var/www/certbot        # ACME challenge
    depends_on:
      - app_php
    networks:
      - laravel
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: crm-certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./letsencrypt/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet --agree-tos;
        sleep 12h;
      done"

  mysql:
    image: mysql:8.0
    container_name: crm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel
    restart: unless-stopped

volumes:
  dbdata:

networks:
  laravel:
    driver: bridge
