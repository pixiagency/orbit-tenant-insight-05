services:
  nginx:
    depends_on:
      app_php:
        condition: service_started
        required: true
    ports:
      # Use alternative ports to avoid conflicts
      - "8080:80"   # HTTP on port 8080
      - "8443:443"  # HTTPS on port 8443
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./letsencrypt/www:/var/www/certbot:ro
      - ./public:/var/www/html/public:ro

  certbot:
    image: certbot/certbot:latest
    container_name: crm-certbot
    depends_on:
      - nginx
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./letsencrypt/www:/var/www/certbot
    # Override certbot to use custom port for validation
    command: >
      sh -c "
      echo 'Note: Using alternative ports. You will need to configure your main reverse proxy to handle SSL challenges.'
      && sleep infinity
      "

volumes:
  letsencrypt:
