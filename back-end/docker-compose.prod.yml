services:
  app:
    build: .
    container_name: crm-app
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - crm

  db:
    image: mysql:8.0
    container_name: crm-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crm
      MYSQL_USER: crm
      MYSQL_PASSWORD: crm
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crm

  nginx:
    image: nginx:latest
    container_name: crm-nginx
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - app
    networks:
      - crm

volumes:
  db_data:

networks:
  crm:
    driver: bridge
