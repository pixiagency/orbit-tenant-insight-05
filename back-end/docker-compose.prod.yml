services:
  nginx:
    image: nginx:alpine
    container_name: crm-nginx
    restart: unless-stopped
    depends_on:
      app_php:
        condition: service_started
        required: true
    ports:
      - "8080:8080"  # HTTP port (alternative to avoid conflicts)
      - "8443:8443"  # HTTPS port (alternative to avoid conflicts)
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./letsencrypt/www:/var/www/certbot:ro
      - ./public:/var/www/html/public:ro
      - ./logs/nginx:/var/log/nginx
    environment:
      - TZ=UTC
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  certbot:
    image: certbot/certbot:latest
    container_name: crm-certbot
    restart: "no"
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./letsencrypt/www:/var/www/certbot
      - ./logs/certbot:/var/log/letsencrypt
    environment:
      - TZ=UTC
    # Only run when explicitly called
    profiles:
      - tools
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    name: crm-network

volumes:
  letsencrypt:
    driver: local
  nginx-logs:
    driver: local
  certbot-logs:
    driver: local
